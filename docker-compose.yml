# Shared backend env (top-level extension anchor, reused by api + worker).
x-backend-env: &backend-env
  APP_NAME: ${APP_NAME:-multilingual-rag}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Intra-network addresses — deliberately NOT ${VAR:-default}. Compose interpolates such vars
  # from the host .env, and a local-dev .env correctly points at localhost, which inside a
  # container means the container itself (connection refused). Service names are always right
  # here, so they are pinned; override them with a compose override file if you truly need to.
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/multilingual_rag
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  # Generation (OpenAI-compatible; NVIDIA NIM by default). Set GENERATION_API_KEY to enable answers.
  GENERATION_API_KEY: ${GENERATION_API_KEY:-}
  GENERATION_BASE_URL: ${GENERATION_BASE_URL:-https://integrate.api.nvidia.com/v1}
  GENERATION_MODEL: ${GENERATION_MODEL:-meta/llama-3.1-8b-instruct}
  # Embedded ChromaDB vector store (persisted under /app/data).
  CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-data/chroma}
  RAW_DOCUMENT_DIRECTORY: ${RAW_DOCUMENT_DIRECTORY:-data/raw}
  # bge-m3 lives in the shared hf_cache volume, NOT on the host. Pinned (not ${...}) for the same
  # reason as the URLs above: a local-dev .env sets HF_HUB_OFFLINE=true because the model is cached
  # on the host, and leaking that in would leave containers unable to fetch it — ingestion then
  # fails with "couldn't connect to huggingface.co ... and couldn't find them in the cached files".
  # The first run downloads ~2.2 GB into hf_cache; later runs reuse it.
  HF_HUB_OFFLINE: "false"
  HF_HOME: /home/appuser/.cache/huggingface
  WARM_EMBEDDINGS_ON_STARTUP: ${WARM_EMBEDDINGS_ON_STARTUP:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multilingual_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Shared bge-m3 download (~2.2 GB) — fetched once, reused by api + worker and across restarts.
      - hf_cache:/home/appuser/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "scripts/smoke_test.py", "--base-url", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build: .
    command: celery -A multilingual_rag.workers.celery_app.celery_app worker --loglevel=INFO --pool=solo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *backend-env
    volumes:
      - ./data:/app/data
      - hf_cache:/home/appuser/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle — the URL the browser uses to reach the API.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  hf_cache:
